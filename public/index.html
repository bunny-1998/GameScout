<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Scout — competitor recon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Game Scout</span>
    </div>

    <form id="scout-form" class="controls" autocomplete="off">
      <div class="field field--search">
        <input id="game" name="game" type="text" placeholder="Game name, or bundle ID (com.xxx.yyy / App Store ID)…" required />
      </div>

      <div class="seg" role="group" aria-label="Platform">
        <button type="button" class="seg__btn is-active" data-platform="ios">iOS</button>
        <button type="button" class="seg__btn" data-platform="android">Android</button>
      </div>

      <label class="count">
        <span>Show</span>
        <input id="count" type="range" min="10" max="150" step="10" value="50" />
        <output id="count-out">50</output>
      </label>

      <button type="submit" class="scout-btn" id="scout-btn">Scout</button>
    </form>
  </header>

  <main class="stage">
    <!-- Seed / your game -->
    <section id="seed" class="seed" hidden></section>

    <!-- Result toolbar -->
    <div id="toolbar" class="toolbar" hidden>
      <span id="result-count" class="toolbar__count"></span>
      <label class="sort">
        <span>Sort by</span>
        <select id="sort">
          <option value="installsNum">Total installs</option>
          <option value="downloadsMonth">Downloads / month</option>
          <option value="downloadsDaily">Downloads / day</option>
          <option value="revenueMonth">Revenue / month</option>
          <option value="rating">Rating</option>
          <option value="rank">Category rank</option>
        </select>
      </label>
    </div>

    <!-- Competitor grid -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- Empty / first-run -->
    <section id="empty" class="empty">
      <div class="empty__art" aria-hidden="true"></div>
      <h1>Scout any game's field</h1>
      <p>Enter one of your games above. Game Scout pulls every matching game on the store — ranked by installs — with icons, screenshots, downloads, revenue and full store details.</p>
    </section>

    <!-- Error -->
    <section id="error" class="note note--error" hidden></section>
  </main>

  <!-- Detail drawer -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer__scrim" data-close></div>
    <aside class="drawer__panel" role="dialog" aria-label="Competitor detail"></aside>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__close" data-close aria-label="Close">✕</button>
    <img id="lightbox-img" alt="" />
  </div>

  <script src="app.js"></script>
</body>
</html>
